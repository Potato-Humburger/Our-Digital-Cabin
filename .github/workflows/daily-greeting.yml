name: 💘 每日早安问候

on:
  schedule:
    - cron: '0 7 * * *'  # 每天 UTC 7:00 (可根据时区调整)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  daily-greeting:
    runs-on: ubuntu-latest
    steps:
      - name: 获取今日日期
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: 创建每日问候 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const greetings = [
              "早上好，我的爱！☀️ 希望今天对你是美好的一天。",
              "起床了，小懒虫！😴 我已经在想你了。💕",
              "新的一天，新的冒险。让我们一起开始！🚀",
              "早安！你是我每天开始的原因。💕",
              "日出很美，但你更美。😍 早上好！",
              "好吧，是时候醒来开始我们的冒险了！🌟",
              "每个日出都有你的想法，早上好！☀️💕"
            ];
            
            const greeting = greetings[Math.floor(Math.random() * greetings.length)];
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `☀️ [${process.env.DATE}] 早安，我的爱！`,
              body: `${greeting}\n\n---\n\n💭 今天你想分享什么吗？`,
              labels: ['💚-心对心', '💘-问候']
            });
        env:
          DATE: ${{ steps.date.outputs.DATE }}
