name: 🤫 同步悄悄话记录

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write
  issues: read

jobs:
  sync-notes:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 整理悄悄话
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const allowedAuthors = new Set(['OWNER', 'COLLABORATOR', 'MEMBER']);
            const notes = issues
              .filter((issue) => !issue.pull_request && allowedAuthors.has(issue.author_association) && /^\[\d{4}-\d{2}-\d{2}\] message from /i.test(issue.title))
              .map((issue) => {
                const author = issue.title.replace(/^\[\d{4}-\d{2}-\d{2}\] message from /i, '').trim();
                const time = issue.body?.match(/\*\*时间：\*\*\s*(.+)/)?.[1]?.trim() || issue.created_at;
                const message = issue.body
                  ?.replace(/^## 🤫 悄悄话\s*/m, '')
                  .replace(/\*\*来自：\*\*.*\n?/, '')
                  .replace(/\*\*时间：\*\*.*\n?/, '')
                  .replace(/\n---[\s\S]*$/, '')
                  .trim() || '';
                return { id: issue.number, author, time, message, url: issue.html_url };
              })
              .sort((a, b) => b.id - a.id);
            fs.writeFileSync('data/secret-notes.json', `${JSON.stringify({ notes }, null, 2)}\n`);

      - name: 提交记录
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/secret-notes.json
          git diff --cached --quiet || git commit -m '🤫 同步悄悄话记录'
          git push
