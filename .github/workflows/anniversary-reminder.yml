name: 🎂 纪念日提醒

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 UTC 8:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-anniversaries:
    runs-on: ubuntu-latest
    steps:
      - name: 检查特殊日期
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayMD = `${month}-${day}`;
            
            // 这个数组应该从你的 dates/anniversaries.json 中读取
            const anniversaries = [
              { date: "05-14", event: "我们相遇的日子", emoji: "🌹" },
              { date: "02-14", event: "情人节", emoji: "💕" },
              { date: "03-14", event: "白色情人节", emoji: "🍫" }
            ];
            
            const match = anniversaries.find(a => a.date === todayMD);
            
            if (match) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${match.emoji} [特殊日期] ${match.event}`,
                body: `🎉 今天是 **${match.event}**！\n\n💕 让我们庆祝这个特殊的日子。\n\n🎁 有什么特别的计划吗？`,
                labels: ['🎉-庆祝', '📅-特殊日期']
              });
            }
