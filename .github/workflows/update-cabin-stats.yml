name: 📊 更新数字小屋数据

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 计算并写入统计数据
        env:
          TZ: Asia/Shanghai
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }).format(new Date());
          const startDate = '2025-07-18';
          const daysTogether = Math.floor(
            (Date.parse(`${today}T00:00:00Z`) - Date.parse(`${startDate}T00:00:00Z`)) / 86400000
          );

          const metricsPath = 'data/metrics.json';
          const metrics = JSON.parse(fs.readFileSync(metricsPath, 'utf8'));
          metrics.relationship.days_together = daysTogether;
          fs.writeFileSync(metricsPath, `${JSON.stringify(metrics, null, 2)}\n`);

          const status = JSON.parse(fs.readFileSync('data/status.json', 'utf8'));
          const readmePath = 'README.md';
          const readme = fs.readFileSync(readmePath, 'utf8');
          const stats = [
            '| 🎯 | 你的信息 |',
            '|---|---|',
            `| **相伴天数** | ${daysTogether} 天 |`,
            `| **当前位置** | ${status.location} |`,
            `| **当前心情** | ${status.current_mood}：${status.mood_description} |`,
            '| **下一个里程碑** | 🎉 查看 dates/calendar.md |',
            `| **距离** | 📏 ${status.location.includes('，') ? '暂时异地' : '在一起'} |`
          ].join('\n');
          const updated = readme.replace(
            /<!-- cabin-stats:start -->[\s\S]*?<!-- cabin-stats:end -->/,
            `<!-- cabin-stats:start -->\n${stats}\n<!-- cabin-stats:end -->`
          );
          fs.writeFileSync(readmePath, updated);

          execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
          execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
          execFileSync('git', ['add', metricsPath, readmePath]);
          try {
            execFileSync('git', ['commit', '-m', '📊 自动更新数字小屋统计']);
            execFileSync('git', ['push']);
          } catch (error) {
            if (!error.stdout?.toString().includes('nothing to commit')) throw error;
          }
          NODE