name: 💭 每日爱情语录

on:
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 9:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  quote-generator:
    runs-on: ubuntu-latest
    steps:
      - name: 创建语录 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const quotes = [
              { text: "你改变了我对爱的看法。", author: "💕" },
              { text: "有你在，我感到完整。", author: "💕" },
              { text: "每一天都因为你而特别。", author: "💕" },
              { text: "我不仅爱你的外表，更爱你的灵魂。", author: "💕" },
              { text: "你是我最好的冒险。", author: "💕" },
              { text: "生活和你在一起更有意义。", author: "💕" },
              { text: "你的爱给了我希望。", author: "💕" },
              { text: "你是我的家。", author: "💕" },
              { text: "我为有你而感激。", author: "💕" },
              { text: "你让我想成为更好的人。", author: "💕" },
              { text: "永远爱你，直到永远。", author: "💕" },
              { text: "你是我的梦想成真。", author: "💕" },
              { text: "和你在一起是我做过最好的决定。", author: "💕" },
              { text: "你的笑容是我最喜欢的视线。", author: "💕" },
              { text: "无论发生什么，我都会在这里。", author: "💕" }
            ];
            
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            const date = new Date().toISOString().split('T')[0];
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `💭 [${date}] 今日语录`,
              body: `> ${quote.text}\n\n${quote.author}\n\n---\n\n✨ 希望这句话能温暖你的一天。`,
              labels: ['💭-语录', '💚-心对心']
            });
