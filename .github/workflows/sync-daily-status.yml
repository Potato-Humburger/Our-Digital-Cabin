name: 📝 同步每日状态

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'

permissions:
  contents: write
  issues: read

jobs:
  sync-status:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 写入最新状态
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });
            const allowedAuthors = new Set(['OWNER', 'COLLABORATOR', 'MEMBER']);
            const updates = issues
              .filter((issue) => !issue.pull_request && allowedAuthors.has(issue.author_association) && /^📝 \[daily-status\]/i.test(issue.title))
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            if (!updates.length) {
              core.info('没有找到每日状态更新');
              return;
            }
            const match = updates[0].body?.match(/<!-- DAILY_STATUS_JSON\n([\s\S]*?)\nDAILY_STATUS_JSON -->/);
            if (!match) {
              core.setFailed('每日状态 Issue 缺少状态数据');
              return;
            }
            const incoming = JSON.parse(match[1]);
            const statusPath = 'data/status.json';
            const current = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
            fs.writeFileSync(statusPath, `${JSON.stringify({ ...current, ...incoming }, null, 2)}\n`);

      - name: 提交状态 JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status.json
          git diff --cached --quiet || git commit -m '📝 同步每日状态'
          git push
